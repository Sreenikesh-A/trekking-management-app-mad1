<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Staff</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h2>Manage Staff</h2>
    <hr>
    <a href="/homepage" class="btn btn-secondary">Home</a>
    <br><br>
    <form method="GET">
    <input
        type="text"
        name="search"
        placeholder="Search Staff"
        class="form-control" 
        value="{{ request.args.get('search', '') }}">
    <br>
    <button class="btn btn-success">Search</button>
</form> 
<br>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
        {% for staff in staffs %}
        <tr>
            <td>{{ staff.name }}</td>
            <td>{{ staff.mail }}</td>
            <td>{{ staff.status }}</td>
            <td>
                <a href="/approve_staff/{{ staff.id }}"
                 class="btn btn-success btn-sm">Approve</a>    
                <a href="/blacklist_staff/{{ staff.id }}"
                   class="btn btn-danger btn-sm">Blacklist</a>
            </td>
        </tr>
        {% endfor %}
        </tbody>

    </table>

</body>

</html>
