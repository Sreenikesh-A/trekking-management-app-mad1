<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Trek</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">
    <h2>Add Trek</h2>
    <hr>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Trek Name</label>
            <input type="text" class="form-control" name="trek_name" value="{{ trek.trek_name if trek else '' }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Location</label>
            <input type="text" class="form-control" name="location" value="{{ trek.location if trek else '' }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Difficulty</label>
            <select class="form-select" name="difficulty">
                <option>Easy</option>
                <option>Moderate</option>
                <option>Hard</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Duration (Days)</label>
            <input type="number" class="form-control" name="duration" value="{{ trek.duration if trek else '' }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Available Slots</label>
            <input type="number" class="form-control" name="slots" value="{{ trek.slots if trek else '' }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Status</label>

            <select class="form-select" name="status">
                <option>Open</option>
                <option>Closed</option>
            </select>

        </div>

        <button type="submit" class="btn btn-success">
            Add Trek
        </button>

        <a href="/manage_trek" class="btn btn-secondary">
            Back
        </a>

    </form>

</body>

</html>
