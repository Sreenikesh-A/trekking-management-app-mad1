<!DOCTYPE html>
<html>

<head>
    <title>Participants</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h2>Participants</h2>
    <hr>
    <a href="/staff_page/{{ session['user_id'] }}"
       class="btn btn-secondary">Back</a>
    <br><br>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>User ID</th>
                <th>Name</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user.id }}</td>
                <td>{{ user.name }}</td>
                <td>{{ user.mail }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
