<!DOCTYPE html>
<html>
<head>
    <title>User Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h2>User Dashboard</h2>
    <hr>
    <a href="/logout" class="btn btn-danger">Logout</a>
    <br><br>
    <a href="/my_bookings" class="btn btn-primary">My Bookings</a>
<br><br>
    <h4>Available Treks</h4>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Trek Name</th>
                <th>Location</th>
                <th>Difficulty</th>
                <th>Slots</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
        {% for trek in treks %}
        <tr>
            <td>{{ trek.trek_name }}</td>
            <td>{{ trek.location }}</td>
            <td>{{ trek.difficulty }}</td>
            <td>{{ trek.slots }}</td>
            <td>{{ trek.status }}</td>
            <td>
                <a href="/book_trek/{{ trek.id }}"
                   class="btn btn-success btn-sm">Book</a>
            </td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
</body>
</html>
